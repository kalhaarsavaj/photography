<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #c5c6c7;
            --accent-color: #66fcf1;
            --card-bg: #1f2833;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 0 30px 0;
        }

        header h1 {
            color: var(--white);
            font-size: 2.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        /* --- LAYER 1: ALBUM COVERS --- */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .album-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .album-card:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(102, 252, 241, 0.2);
        }

        .album-cover-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }

        .album-info {
            padding: 20px;
            text-align: center;
            background: var(--card-bg);
        }

        .album-info h2 {
            color: var(--white);
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        /* --- LAYER 2: COLLAGE VIEW (WIX-STYLE MASONRY) --- */
        .session-view {
            display: none;
        }

        .session-view.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        .session-title-block {
            margin-bottom: 40px;
        }

        .session-title-block h2 {
            color: var(--white);
            font-size: 2rem;
        }

        /* Real Responsive Masonry - No Image Cropping */
        .collage-grid {
            column-count: 3;
            column-gap: 15px;
            width: 100%;
        }

        .collage-item {
            background-color: var(--card-bg);
            margin-bottom: 15px;
            break-inside: avoid;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            cursor: zoom-in;
            display: block;
        }

        .collage-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .collage-item:hover img {
            transform: scale(1.03);
        }

        /* Responsive Breakpoints for Masonry Columns */
        @media (max-width: 900px) {
            .collage-grid {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .collage-grid {
                column-count: 1;
            }
        }

        /* --- LIGHTBOX MODAL --- */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: var(--white);
            font-size: 45px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

        // =========================================================================

        // Rendering Core UI Logic
        function renderPortfolioHub() {
            const grid = document.getElementById('albumGridContainer');
            grid.innerHTML = '';

            GALLERY_DATA.forEach((album, index) => {
                const coverUrl = `https://drive.google.com/thumbnail?id=${album.coverImageId}&sz=w800`;

                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => openAlbum(index);
                card.innerHTML = `
                    <img class="album-cover-img" src="${coverUrl}" alt="${album.albumTitle}">
                    <div class="album-info">
                        <h2>${album.albumTitle}</h2>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAlbum(index) {
            const album = GALLERY_DATA[index];
            document.getElementById('mainHub').style.display = 'none';

            document.getElementById('currentAlbumTitle').innerText = album.albumTitle;
            const collageContainer = document.getElementById('collageGridContainer');
            collageContainer.innerHTML = '';

            album.photos.forEach((photo) => {
                const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w800`;
                const fullUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w1600`;

                const item = document.createElement('div');
                item.className = 'collage-item';
                item.onclick = () => viewPhoto(fullUrl);
                item.innerHTML = `<img src="${thumbUrl}" alt="${photo.name}" loading="lazy">`;

                collageContainer.appendChild(item);
            });

            document.getElementById('dynamicSessionView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showHub() {
            document.getElementById('dynamicSessionView').classList.remove('active');
            document.getElementById('mainHub').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function viewPhoto(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxModal').classList.add('active');
        }

        function closePhoto() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        // Initialize Layout on Window Load
        document.addEventListener("DOMContentLoaded", renderPortfolioHub);
    </script>
